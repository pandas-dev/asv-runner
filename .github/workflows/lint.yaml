name: Lint
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  lint:
    concurrency:
      group: lint-${{ github.event_name == 'push' && github.run_number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run prek
        uses: j178/prek-action@v3.1.1
        with:
          extra-args: --verbose --all-files
