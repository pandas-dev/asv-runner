name: Process ASV Results
on:
#  pull_request:
#    branches:
#      - main
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

env:
  # Results and other data are stored away from the main branch.
  # This keeps the main branch clean and allows us to clear out
  # objects / history after being built up for long periods of time.
  BRANCH_NAME: pandas_2026_01_04
  PYTHON_VERSION: 3.12

# Serialize against run_asvs_2026_01_04.yaml. Both workflows write to the
# same storage branch via orphan force-push.
concurrency:
  group: storage-pandas_2026_01_04
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-results:
    name: Process ASV Results
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout pandas
        uses: actions/checkout@v6
        with:
          repository: pandas-dev/pandas
          fetch-depth: 0

      - name: Checkout asv-runner results branch
        uses: actions/checkout@v6
        with:
          ref: "${{ env.BRANCH_NAME }}"
          path: asv-runner/

      # Idempotent migration from the legacy loose-files layout to compressed
      # tarballs. No-op once the tarballs exist.
      - name: Migrate legacy storage layout
        run: |
          if [ -d asv-runner/data/results ] && [ ! -f asv-runner/data/results.tar.zst ]; then
            tar -C asv-runner/data -I 'zstd -19' -cf asv-runner/data/results.tar.zst results
          fi
          if [ -d asv-runner/data/envs ] && [ ! -f asv-runner/data/envs.tar.zst ]; then
            tar -C asv-runner/data -I 'zstd -19' -cf asv-runner/data/envs.tar.zst envs
          fi
          rm -rf asv-runner/data/results asv-runner/data/envs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install environment dependencies
        run: pip install -U pip uv

      - name: Install job dependencies
        run: uv pip install --system asv pandas pyarrow

      - name: Show environment packages
        run: uv pip freeze

      # Extract results.tar.zst into asv_bench/ so `asv publish` and
      # process_results.py see the same paths as before. Extract envs.tar.zst
      # back under asv-runner/data/envs/ so make_issues.py can read per-SHA
      # env files. The extracted dirs are gitignored.
      - name: Extract result and env archives
        run: |
          tar -I zstd -xf asv-runner/data/results.tar.zst -C asv_bench/
          tar -I zstd -xf asv-runner/data/envs.tar.zst -C asv-runner/data/

      - name: Publish ASV Benchmarks
        run: cd asv_bench && asv publish

      - name: Process ASV results
        run: |
          python asv-runner/ci/process_results.py --input-path=asv_bench/ --output-path=asv-runner/data
          rm -rf asv-runner/docs
          mv asv_bench/html/ asv-runner/docs

      - name: Make issues for new regressions
        run: python asv-runner/ci/make_issues.py --input-path=asv-runner/data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push results
        run: |
          cd asv-runner
          EXPECTED=$(git rev-parse origin/${BRANCH_NAME})
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "Results"
          git branch -M fresh ${BRANCH_NAME}
          git push --force-with-lease=${BRANCH_NAME}:${EXPECTED} origin ${BRANCH_NAME}
