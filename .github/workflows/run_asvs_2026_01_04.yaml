name: Run ASV
on:
#  pull_request:
#    branches:
#      - main
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

env:
  ENV_FILE: environment.yml
  PANDAS_CI: 1
  # Results and other data are stored away from the main branch.
  # This keeps the main branch clean and allows us to clear out
  # objects / history after being built up for long periods of time.
  BRANCH_NAME: pandas_2026_01_04

# Serialize all writes to the storage branch (across this workflow and
# process_results.yaml). Required because both pushes below are orphan
# force-pushes — concurrent writers would clobber each other.
concurrency:
  group: storage-pandas_2026_01_04
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  asv:
    name: Run ASVs
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    permissions:
      contents: write
      issues: write
    outputs:
      new_commit: ${{ steps.get-commit.outputs.new_commit }}
    steps:
      # In order to run pandas' actions, we have to checkout into the root directory.
      - name: Checkout pandas
        uses: actions/checkout@v6
        with:
          repository: pandas-dev/pandas
          fetch-depth: 0

      - name: Checkout asv-runner results branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          path: asv-runner/

      # One-shot migration from the legacy loose-files layout to compressed
      # tarballs. Idempotent: a no-op once the tarballs exist.
      - name: Migrate legacy storage layout
        run: |
          if [ -d asv-runner/data/results ] && [ ! -f asv-runner/data/results.tar.zst ]; then
            tar -C asv-runner/data -I 'zstd -19' -cf asv-runner/data/results.tar.zst results
          fi
          if [ -d asv-runner/data/envs ] && [ ! -f asv-runner/data/envs.tar.zst ]; then
            tar -C asv-runner/data -I 'zstd -19' -cf asv-runner/data/envs.tar.zst envs
          fi
          rm -rf asv-runner/data/results asv-runner/data/envs

      - name: Set up pixi
        uses: ./.github/actions/setup-pixi
        with:
          environment: "asv"

      - name: Get Commit
        id: get-commit
        run: |
          sha="$(python asv-runner/ci/find_commit_to_run.py --input-path=asv-runner/data/ --repo-path=.)"
          echo "sha: $sha"
          if [ "$sha" = "NONE" ]; then
            echo "new_commit=no"
            echo "new_commit=no" >> "$GITHUB_OUTPUT"
          else
            echo "new_commit=yes"
            echo "new_commit=yes" >> "$GITHUB_OUTPUT"
            echo "$sha" >> asv-runner/data/shas.txt
            git checkout $sha
          fi

      # Claim the lock: orphan force-push so the storage branch ends up at a
      # single commit with the new shas.txt entry. Concurrent runners
      # (serialized by the concurrency group) see the new SHA on their next
      # find_commit_to_run.py call and skip it.
      - name: Push shas.txt
        if: ${{ steps.get-commit.outputs.new_commit == 'yes' }}
        run: |
          cd asv-runner
          EXPECTED=$(git rev-parse origin/${BRANCH_NAME})
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "Update shas.txt"
          git branch -M fresh ${BRANCH_NAME}
          git push --force-with-lease=${BRANCH_NAME}:${EXPECTED} origin ${BRANCH_NAME}

      - name: Build pandas
        if: ${{ steps.get-commit.outputs.new_commit == 'yes' }}
        run: pixi run --environment asv build-pandas --editable -Csetup-args="--werror"

      - name: Run ASV Benchmarks
        if: ${{ steps.get-commit.outputs.new_commit == 'yes' }}
        run: |
          eval "$(pixi shell-hook -e asv)"
          cd asv_bench
          python -m asv machine --machine=asvrunner --yes
          python -m asv run --machine=asvrunner --python=same --set-commit-hash=$(git rev-parse HEAD) --show-stderr

      # Extract the existing tarballs into a temp dir, append this run's
      # outputs, and re-archive over the originals. Compression at zstd -19
      # for max ratio (the cost is paid once per run, ~hourly).
      - name: Update result archives
        if: ${{ steps.get-commit.outputs.new_commit == 'yes' }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          WORK=$(mktemp -d)
          mkdir -p "$WORK/results/asvrunner" "$WORK/envs"

          if [ -f asv-runner/data/results.tar.zst ]; then
            tar -I zstd -xf asv-runner/data/results.tar.zst -C "$WORK"
          fi
          if [ -f asv-runner/data/envs.tar.zst ]; then
            tar -I zstd -xf asv-runner/data/envs.tar.zst -C "$WORK"
          fi

          cp asv_bench/results/benchmarks.json "$WORK/results/"
          cp asv_bench/results/asvrunner/machine.json "$WORK/results/asvrunner/"
          cp asv_bench/results/asvrunner/${SHORT_SHA}-existing*.json "$WORK/results/asvrunner/${SHA}.json"
          pixi list -e asv --fields name,version > "$WORK/envs/${SHA}.yml"

          tar -C "$WORK" -I 'zstd -19' -cf asv-runner/data/results.tar.zst results
          tar -C "$WORK" -I 'zstd -19' -cf asv-runner/data/envs.tar.zst envs

      - name: Push results
        if: ${{ steps.get-commit.outputs.new_commit == 'yes' }}
        run: |
          cd asv-runner
          EXPECTED=$(git rev-parse origin/${BRANCH_NAME})
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "Results"
          git branch -M fresh ${BRANCH_NAME}
          git push --force-with-lease=${BRANCH_NAME}:${EXPECTED} origin ${BRANCH_NAME}
