name: Run ASV
on:
#  pull_request:
#    branches:
#      - main
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

env:
  ENV_FILE: environment.yml
  PANDAS_CI: 1
  # Results and other data are stored away from the main branch.
  # This keeps the main branch clean and allows us to clear out
  # objects / history after being built up for long periods of time.
  BRANCH_NAME: pandas_2026_01_04

permissions:
  contents: read

jobs:
  # Pick the next un-benchmarked SHA and reserve it via shas.txt.
  # Fast (~seconds) so concurrent claims rarely collide; the retry loop
  # below covers the case when they do.
  claim:
    name: Claim SHA
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.claim.outputs.sha }}
      new_commit: ${{ steps.claim.outputs.new_commit }}
    steps:
      # In order to run pandas' actions, we have to checkout into the root directory.
      - name: Checkout pandas
        uses: actions/checkout@v6
        with:
          repository: pandas-dev/pandas
          fetch-depth: 0

      - name: Checkout asv-runner results branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          path: asv-runner/

      # ci/ scripts are run from main, not from whatever stale copy lives
      # on the storage branch. The storage branch is data-only.
      - name: Checkout asv-runner main branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: asv-runner-code/

      - name: Claim next SHA
        id: claim
        run: |
          claimed=false
          new_commit=no
          sha=NONE
          for attempt in $(seq 1 5); do
            cd asv-runner
            git fetch origin ${BRANCH_NAME}
            git checkout -B ${BRANCH_NAME} origin/${BRANCH_NAME}
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Migrate from legacy loose uncompressed JSON/YAML files to
            # per-file zstd. Idempotent: subsequent runs find no *.json
            # (besides machine.json, excluded) or *.yml and the find
            # produces no input.
            if [ -d data/results/asvrunner ]; then
              find data/results/asvrunner -name '*.json' ! -name 'machine.json' -print0 |
                xargs -0 -r -P 4 -n 50 zstd --rm -19 -q
            fi
            if [ -d data/envs ]; then
              find data/envs -name '*.yml' -print0 |
                xargs -0 -r -P 4 -n 50 zstd --rm -19 -q
            fi

            cd ..
            sha="$(python3 asv-runner-code/ci/find_commit_to_run.py --input-path=asv-runner/data/ --repo-path=.)"
            if [ "$sha" = "NONE" ]; then
              new_commit=no
              claimed=true
              break
            fi

            echo "$sha" >> asv-runner/data/shas.txt

            cd asv-runner
            EXPECTED=$(git rev-parse origin/${BRANCH_NAME})
            git checkout --orphan fresh
            git add -A
            git commit -m "Update shas.txt"
            git branch -M fresh ${BRANCH_NAME}

            if git push --force-with-lease=${BRANCH_NAME}:${EXPECTED} origin ${BRANCH_NAME}; then
              new_commit=yes
              claimed=true
              cd ..
              break
            fi

            cd ..
            echo "Claim race lost on attempt $attempt; retrying"
            sleep $((attempt * 5 + RANDOM % 10))
          done

          if [ "$claimed" = "false" ]; then
            echo "Failed to claim a commit after retries" >&2
            exit 1
          fi

          echo "new_commit=$new_commit" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Build pandas at the claimed SHA and run the ASV suite. No concurrency
  # lock here — multiple workflow runs benchmark different SHAs in parallel.
  # The new <sha>.json and <sha>.yml are zstd-compressed before upload so
  # the merge job can drop them into the storage tree as-is.
  benchmark:
    name: Run benchmarks
    needs: claim
    if: needs.claim.outputs.new_commit == 'yes'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    env:
      SHA: ${{ needs.claim.outputs.sha }}
    steps:
      - name: Checkout pandas
        uses: actions/checkout@v6
        with:
          repository: pandas-dev/pandas
          fetch-depth: 0

      - name: Set up pixi
        uses: ./.github/actions/setup-pixi
        with:
          environment: "asv"

      - name: Checkout target SHA
        run: git checkout $SHA

      - name: Build pandas
        run: pixi run --environment asv build-pandas --editable -Csetup-args="--werror"

      - name: Run ASV Benchmarks
        run: |
          eval "$(pixi shell-hook -e asv)"
          cd asv_bench
          python -m asv machine --machine=asvrunner --yes
          python -m asv run --machine=asvrunner --python=same --set-commit-hash=$SHA --show-stderr

      - name: Stage outputs for upload
        run: |
          SHORT_SHA=$(git rev-parse --short=8 $SHA)
          mkdir -p /tmp/upload/results/asvrunner /tmp/upload/envs
          cp asv_bench/results/benchmarks.json /tmp/upload/results/
          cp asv_bench/results/asvrunner/machine.json /tmp/upload/results/asvrunner/
          cp asv_bench/results/asvrunner/${SHORT_SHA}-existing*.json /tmp/upload/results/asvrunner/${SHA}.json
          pixi list -e asv --fields name,version > /tmp/upload/envs/${SHA}.yml
          # Compress per-SHA files. benchmarks.json and machine.json stay
          # uncompressed (small, overwritten each run, read directly).
          zstd --rm -19 -q /tmp/upload/results/asvrunner/${SHA}.json
          zstd --rm -19 -q /tmp/upload/envs/${SHA}.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asv-results-${{ needs.claim.outputs.sha }}
          path: /tmp/upload/

  # Drop this run's compressed files into the storage tree and orphan
  # force-push. If a concurrent merge wins the race (lease fails), refetch
  # — that winner's data is already on disk after the fetch — and redo.
  merge:
    name: Merge into storage branch
    needs: [claim, benchmark]
    if: needs.claim.outputs.new_commit == 'yes'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    permissions:
      contents: write
    env:
      SHA: ${{ needs.claim.outputs.sha }}
    steps:
      - name: Checkout asv-runner results branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          path: asv-runner/

      - name: Download benchmark output
        uses: actions/download-artifact@v4
        with:
          name: asv-results-${{ needs.claim.outputs.sha }}
          path: /tmp/new

      - name: Merge results and push
        run: |
          for attempt in $(seq 1 5); do
            cd asv-runner
            git fetch origin ${BRANCH_NAME}
            git checkout -B ${BRANCH_NAME} origin/${BRANCH_NAME}
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Migrate from legacy loose uncompressed files to per-file zstd.
            # Idempotent.
            if [ -d data/results/asvrunner ]; then
              find data/results/asvrunner -name '*.json' ! -name 'machine.json' -print0 |
                xargs -0 -r -P 4 -n 50 zstd --rm -19 -q
            fi
            if [ -d data/envs ]; then
              find data/envs -name '*.yml' -print0 |
                xargs -0 -r -P 4 -n 50 zstd --rm -19 -q
            fi

            # Drop in this run's new files.
            mkdir -p data/results/asvrunner data/envs
            cp /tmp/new/results/benchmarks.json data/results/
            cp /tmp/new/results/asvrunner/machine.json data/results/asvrunner/
            cp /tmp/new/results/asvrunner/${SHA}.json.zst data/results/asvrunner/
            cp /tmp/new/envs/${SHA}.yml.zst data/envs/

            EXPECTED=$(git rev-parse origin/${BRANCH_NAME})
            git checkout --orphan fresh
            git add -A
            git commit -m "Results"
            git branch -M fresh ${BRANCH_NAME}

            if git push --force-with-lease=${BRANCH_NAME}:${EXPECTED} origin ${BRANCH_NAME}; then
              echo "Push succeeded on attempt $attempt"
              cd ..
              exit 0
            fi

            cd ..
            echo "Merge race lost on attempt $attempt; retrying"
            sleep $((attempt * 5 + RANDOM % 10))
          done

          echo "Failed to merge after 5 attempts" >&2
          exit 1
