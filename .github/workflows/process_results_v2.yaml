name: Process ASV Results (v2)
on:
  schedule:
    # Two hours after process_results.yaml (03:20), so the asv site it commits
    # to docs/ is current when this workflow deploys Pages.
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: process-results-v2
  cancel-in-progress: false

env:
  # Result and env files are read from the branch the hourly benchmark runs
  # push to; the Parquet store lives on its own branch.
  INPUT_BRANCH: pandas_2026_01_04
  STORE_BRANCH: pandas_2026_01_04_v2
  PYTHON_VERSION: "3.14"
  # Issue links point at wherever the new site is served.
  SITE_URL: ${{ vars.SITE_AT_ROOT == 'new' && 'https://pandas-dev.github.io/asv-runner/' || 'https://pandas-dev.github.io/asv-runner/next/' }}

permissions:
  contents: read

jobs:
  process:
    name: Update store, raise issues, build site
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write # push the store branch
      issues: write
    steps:
      - name: Checkout asv-runner code
        uses: actions/checkout@v6
        with:
          path: code

      - name: Checkout result and env files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.INPUT_BRANCH }}
          path: input
          fetch-depth: 1
          sparse-checkout: |
            data/results
            data/envs

      - name: Checkout the store branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$STORE_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$STORE_BRANCH" "$url" store
          else
            echo "$STORE_BRANCH does not exist yet; starting an empty store."
            git init --quiet -b "$STORE_BRANCH" store
            git -C store remote add origin "$url"
          fi

      # Commit objects only (no trees or files): enough for commit titles.
      - name: Clone pandas history
        run: git clone --quiet --filter=tree:0 --no-checkout https://github.com/pandas-dev/pandas pandas

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install asv-runner
        run: pip install ./code

      - name: Update store
        run: |
          python -m asv_runner_v2 update \
            --input input --store store/data --pandas-repo pandas --workers 4

      - name: Raise issues
        env:
          GH_TOKEN: ${{ github.token }}
          # "new": open issues here. Otherwise write what would be opened to a
          # file; issues already opened by process_results.yaml are skipped,
          # so the file shows where the two pipelines differ.
          RAISE_ISSUES_FROM: ${{ vars.RAISE_ISSUES_FROM }}
        run: |
          if [ "$RAISE_ISSUES_FROM" = "new" ]; then
            python -m asv_runner_v2 issues --store store/data --site-url "$SITE_URL"
          else
            python -m asv_runner_v2 issues --store store/data --site-url "$SITE_URL" \
              --dry-run would_raise.md
          fi

      - name: Build site
        run: python -m asv_runner_v2 site --store store/data --out site

      # A single orphan commit, so the branch never accumulates history.
      - name: Push store
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          expected=$(git rev-parse --verify --quiet HEAD || true)
          git checkout --quiet --orphan fresh
          git add -A
          git commit --quiet -m "Store"
          git branch -M fresh "$STORE_BRANCH"
          if [ -n "$expected" ]; then
            git push --force-with-lease="$STORE_BRANCH:$expected" origin "$STORE_BRANCH"
          else
            git push origin "$STORE_BRANCH"
          fi

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: new-site
          path: site
          retention-days: 7

      - name: Upload would-be issues
        if: hashFiles('would_raise.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: would-raise
          path: would_raise.md
          retention-days: 30

  deploy:
    name: Deploy Pages
    needs: process
    # Runs once the SITE_AT_ROOT variable is set, which goes together with
    # switching the Pages source to GitHub Actions in the repository settings.
    if: vars.SITE_AT_ROOT == 'asv' || vars.SITE_AT_ROOT == 'new'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout the asv site
        uses: actions/checkout@v6
        with:
          ref: ${{ env.INPUT_BRANCH }}
          path: asv-site
          fetch-depth: 1
          sparse-checkout: docs

      - name: Download the new site
        uses: actions/download-artifact@v4
        with:
          name: new-site
          path: new-site

      # SITE_AT_ROOT=asv: asv site at /, new site at /next/.
      # SITE_AT_ROOT=new: new site at /, asv site at /asv/.
      - name: Assemble
        env:
          SITE_AT_ROOT: ${{ vars.SITE_AT_ROOT }}
        run: |
          mkdir _site
          if [ "$SITE_AT_ROOT" = "new" ]; then
            cp -r new-site/. _site/
            mkdir _site/asv
            cp -r asv-site/docs/. _site/asv/
          else
            cp -r asv-site/docs/. _site/
            mkdir _site/next
            cp -r new-site/. _site/next/
          fi
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
