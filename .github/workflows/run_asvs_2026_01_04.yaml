name: Run ASV
on:
#  pull_request:
#    branches:
#      - main
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

env:
  ENV_FILE: environment.yml
  PANDAS_CI: 1
  # Leases (data/shas.txt) live on a small branch of their own. Results are
  # uploaded as artifacts that process_results.yaml stores nightly.
  CLAIMS_BRANCH: asv-claims
  # Suppress cwd-on-sys.path so `python -m asv_runner` doesn't pick up the
  # uncompiled pandas source checkout at the workspace root.
  PYTHONSAFEPATH: "1"

permissions:
  contents: read

jobs:
  run:
    name: Run ASV and upload results
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write
      # claim reports dead runs (expired leases) on a tracking issue.
      issues: write
    steps:
      # In order to run pandas' actions, we have to checkout into the root directory.
      - name: Checkout pandas
        uses: actions/checkout@v7
        with:
          repository: pandas-dev/pandas
          fetch-depth: 0

      # asv_runner scripts are run from the workflow's own ref (main on schedule,
      # whatever branch you choose on workflow_dispatch).
      - name: Checkout asv-runner code
        uses: actions/checkout@v7
        with:
          path: asv-runner-code/

      - name: Checkout the claims branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch "$CLAIMS_BRANCH" "$url" claims

      - name: Claim next SHA
        id: claim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=asv-runner-code python -m asv_runner claim \
            --storage-dir=claims \
            --repo-dir=. \
            --branch=$CLAIMS_BRANCH

      - name: Set up pixi
        if: steps.claim.outputs.new_commit == 'yes'
        uses: ./.github/actions/setup-pixi
        with:
          environment: "asv"

      - name: Checkout target SHA
        if: steps.claim.outputs.new_commit == 'yes'
        run: git checkout ${{ steps.claim.outputs.sha }}

      - name: Build pandas
        if: steps.claim.outputs.new_commit == 'yes'
        run: pixi run --environment asv build-pandas --editable -Csetup-args="--werror"

      - name: Run ASV Benchmarks
        if: steps.claim.outputs.new_commit == 'yes'
        env:
          SHA: ${{ steps.claim.outputs.sha }}
        run: |
          eval "$(pixi shell-hook -e asv)"
          PYTHONPATH=asv-runner-code python -m asv_runner benchmark \
            --asv-dir=asv_bench \
            --sha=$SHA

      - name: Stage results
        if: steps.claim.outputs.new_commit == 'yes'
        env:
          SHA: ${{ steps.claim.outputs.sha }}
        run: |
          PYTHONPATH=asv-runner-code python -m asv_runner stage \
            --asv-dir=asv_bench \
            --sha=$SHA \
            --out-dir=staged

      # process_results.yaml downloads this artifact and stores the results.
      - name: Upload results
        if: steps.claim.outputs.new_commit == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ steps.claim.outputs.sha }}
          path: staged
          retention-days: 90
          if-no-files-found: error

      - name: Mark the lease done
        if: steps.claim.outputs.new_commit == 'yes'
        env:
          SHA: ${{ steps.claim.outputs.sha }}
        run: |
          PYTHONPATH=asv-runner-code python -m asv_runner complete \
            --storage-dir=claims \
            --sha=$SHA \
            --branch=$CLAIMS_BRANCH
