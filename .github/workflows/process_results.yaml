name: Process ASV Results
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: process-results
  cancel-in-progress: false

env:
  # The hourly benchmark runs (run_asvs_*.yaml) upload their results as
  # artifacts named result-<sha>; this workflow stores them in Parquet on
  # STORE_BRANCH. CLAIMS_BRANCH holds the hourly runs' leases.
  STORE_BRANCH: pandas_2026_01_04_v2
  CLAIMS_BRANCH: asv-claims
  # Results were pushed to this branch before the artifacts; still read so none
  # pushed shortly before the switch are missed. Remove once one nightly run
  # after the switch has stored them.
  INPUT_BRANCH: pandas_2026_01_04
  PYTHON_VERSION: "3.14"
  SITE_URL: https://pandas-dev.github.io/asv-runner/

permissions:
  contents: read

jobs:
  process:
    name: Update store, raise issues, build site
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write # push the store branch
      issues: write
      actions: read # download result artifacts
    outputs:
      site: ${{ steps.site.outputs.ready }}
    steps:
      - name: Checkout asv-runner code
        uses: actions/checkout@v6
        with:
          path: code

      - name: Checkout result and env files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.INPUT_BRANCH }}
          path: input
          fetch-depth: 1
          sparse-checkout: |
            data/results
            data/envs

      - name: Checkout the store branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$STORE_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$STORE_BRANCH" "$url" store
          else
            echo "$STORE_BRANCH does not exist yet; starting an empty store."
            git init --quiet -b "$STORE_BRANCH" store
            git -C store remote add origin "$url"
          fi

      # Commit objects only (no trees or files): enough for commit titles.
      - name: Clone pandas history
        run: git clone --quiet --filter=tree:0 --no-checkout https://github.com/pandas-dev/pandas pandas

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install asv-runner
        run: pip install ./code

      - name: Download new results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m asv_runner fetch-results \
            --store store/data --out input --repo "$GITHUB_REPOSITORY"

      - name: Update store
        run: |
          python -m asv_runner update \
            --input input --store store/data --pandas-repo pandas --workers 4

      - name: Raise issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m asv_runner issues --store store/data --site-url "$SITE_URL"

      - name: Build site
        run: python -m asv_runner site --store store/data --out site

      # A single orphan commit, so the branch never accumulates history.
      - name: Push store
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          expected=$(git rev-parse --verify --quiet HEAD || true)
          git checkout --quiet --orphan fresh
          git add -A
          git commit --quiet -m "Store"
          git branch -M fresh "$STORE_BRANCH"
          if [ -n "$expected" ]; then
            git push --force-with-lease="$STORE_BRANCH:$expected" origin "$STORE_BRANCH"
          else
            git push origin "$STORE_BRANCH"
          fi

      # Issues opened while the site was served at /next/ link there; forward
      # those links to the root, keeping the #... part that selects the chart.
      - name: Redirect /next/
        run: |
          mkdir site/next
          cat > site/next/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>pandas benchmarks</title>
          <script>location.replace("../" + location.hash);</script>
          <noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
          <a href="../">pandas benchmarks</a>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mark the site ready
        id: site
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # Fails the job if a benchmarked commit's results never reached the store
      # (its artifact expired or was never uploaded). Pages still deploys.
      - name: Check for lost results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$url" "$CLAIMS_BRANCH" > /dev/null; then
            echo "$CLAIMS_BRANCH does not exist yet; nothing to check."
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$CLAIMS_BRANCH" "$url" claims
          python -m asv_runner check-results --store store/data --claims claims/data/shas.txt

  deploy:
    name: Deploy Pages
    needs: process
    if: ${{ !cancelled() && needs.process.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
