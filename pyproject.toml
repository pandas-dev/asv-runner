[project]
name = "asv-runner"
description = "Run ASVs for a project."
authors = [
    { name = "Richard Shadrach", email = "rhshadrach@gmail.com" },
]
keywords = [
    'Benchmark',
    'Performance',
    'ASV',
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.14"
version = "0.0.1"
dependencies = ["polars", "pyarrow", "zstandard"]
classifiers=[
    'Development Status :: 4 - Beta',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.14',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Operating System :: OS Independent',
    'Topic :: Benchmarks',
]

[project.urls]
Documentation = "https://github.com/rhshadrach/asv-runner/tree/main#readme"
Source = "https://github.com/rhshadrach/asv-runner"
Tracker = "https://github.com/rhshadrach/asv-runner/issues"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asv_runner"]

[tool.setuptools.package-data]
asv_runner = ["site_static/*", "breaks.toml"]

[project.optional-dependencies]
lint = ["pre-commit"]
# pandas: the reference implementation in tests/test_regressions.py
test = ["pandas", "pytest"]
dev = ["asv_runner[lint, test]"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "A",   # flake8-builtins
    # "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    # "D",   # pydocstyle
    "DOC", # pydoclint
    "E",   # pycodestyle - error
    "F",   # Pyflakes
    "FA",  # flake8-future-annotations
    # "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "I",   # isort
    "INP", # flake8-no-pep420
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N",   # pep8-naming
    "PERF", # Perflint
    "PIE", # flake8-pie
    "PL",  # Pylint
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle - warning
    "YTT", # flake8-2020
]
ignore = [
    "A002",
    "PLR2004",  # Magic value used in comparison
    # Size limits on functions say nothing about whether the code is clear.
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR0917",  # Too many positional arguments
]
