name: Process ASV Results
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      skip_check_store:
        description: >-
          Skip check-store, for an update that deliberately changes stored rows
          (such as a schema migration).
        type: boolean
        default: false

concurrency:
  group: process-results
  cancel-in-progress: false

env:
  # The hourly benchmark runs (run_asvs.yaml) upload their results as
  # artifacts named result-<sha>; this workflow stores them in Parquet under
  # data/ in the Hugging Face dataset HF_DATASET. CLAIMS_BRANCH holds the
  # hourly runs' leases.
  # The dataset has the same name as this GitHub repo; never derive one from
  # the other.
  HF_DATASET: pandas-dev/asv-runner
  CLAIMS_BRANCH: asv-claims
  PYTHON_VERSION: "3.14"
  SITE_URL: https://pandas-dev.github.io/asv-runner/

permissions:
  contents: read

jobs:
  process:
    name: Update store, raise issues, build site
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read # check out the code and the claims branch
      issues: write
      actions: read # download result artifacts
      id-token: write # Hugging Face Trusted Publishers
    outputs:
      site: ${{ steps.site.outputs.ready }}
    steps:
      - name: Checkout asv-runner code
        uses: actions/checkout@v7
        with:
          path: code

      # Commit objects only (no trees or files): enough for commit titles.
      - name: Clone pandas history
        run: git clone --quiet --filter=tree:0 --no-checkout https://github.com/pandas-dev/pandas pandas

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install asv-runner
        run: pip install ./code

      # The dataset is public, so reading needs no token.
      - name: Download the store
        run: |
          python -m asv_runner pull-store --dataset "$HF_DATASET" \
            --out store --revision-file hf-revision.txt

      - name: Download new results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m asv_runner fetch-results --store store/data --out input

      - name: Keep the store as downloaded
        run: |
          mkdir -p store/data
          cp -a store/data store-before

      - name: Update store
        run: |
          python -m asv_runner update \
            --input input --store store/data --pandas-repo pandas --workers 4

      # Nothing is pushed if the update changed rows that were already stored.
      - name: Check store
        if: ${{ !inputs.skip_check_store }}
        run: python -m asv_runner check-store --old store-before --new store/data

      - name: Raise issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m asv_runner issues --store store/data --site-url "$SITE_URL"

      - name: Build site
        run: python -m asv_runner site --store store/data --out site

      # One commit on top of the one downloaded; fails if the dataset moved on.
      # The Trusted Publisher on the dataset only accepts this workflow on
      # main, so runs from other branches fail here.
      - name: Push store
        env:
          HF_OIDC_RESOURCE: datasets/${{ env.HF_DATASET }}
        run: |
          python -m asv_runner push-store --dataset "$HF_DATASET" \
            --store store/data --revision-file hf-revision.txt \
            --message "Update store (run $GITHUB_RUN_ID)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Mark the site ready
        id: site
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # Fails the job if a benchmarked commit's results never reached the store
      # (its artifact expired or was never uploaded). Pages still deploys.
      - name: Check for lost results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$url" "$CLAIMS_BRANCH" > /dev/null; then
            echo "$CLAIMS_BRANCH does not exist yet; nothing to check."
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$CLAIMS_BRANCH" "$url" claims
          python -m asv_runner check-results --store store/data --claims claims/data/shas.txt

      # Once the oldest dataset commit is over 30 days old, squash history to
      # one commit, if check-store passes between that commit and this push.
      - name: Squash store history
        env:
          HF_OIDC_RESOURCE: datasets/${{ env.HF_DATASET }}
        run: |
          python -m asv_runner squash-store --dataset "$HF_DATASET" \
            --store store/data --revision-file hf-revision.txt

  deploy:
    name: Deploy Pages
    needs: process
    if: ${{ !cancelled() && needs.process.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
